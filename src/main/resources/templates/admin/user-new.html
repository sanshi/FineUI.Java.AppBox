<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>新增用户</title>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:panel id="Panel1" show-border="false" show-header="false" is-view-port="true" body-padding="10" layout="Fit">
                <f:toolbars>
                    <f:toolbar id="Toolbar1">
                        <f:items>
                            <f:button id="btnClose" icon="SystemClose" text="关闭" click-handler="closeActiveWindow"></f:button>
                            <f:toolbar-separator></f:toolbar-separator>
                            <f:button id="btnSaveClose" validate-forms="SimpleForm1" icon="SystemSaveClose" on-click="btnSaveClose_Click" text="保存后关闭">
                            </f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
                <f:items>
                    <f:form id="SimpleForm1" show-border="true" show-border-shadow="true" show-header="false" body-padding="10" auto-scroll="true">
                        <f:rows>
                            <f:form-row>
                                <f:items>
                                    <f:text-box for="currentUser.name"></f:text-box>
                                    <f:text-box for="currentUser.chineseName"></f:text-box>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:radio-button-list for="currentUser.gender">
                                        <f:radio-item text="男" value="男"></f:radio-item>
                                        <f:radio-item text="女" value="女"></f:radio-item>
                                    </f:radio-button-list>
                                    <f:check-box for="currentUser.enabled"></f:check-box>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:text-box for="currentUser.password" text-mode="Password" required="true" show-red-star="true"></f:text-box>
                                    <f:label></f:label>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:text-box for="currentUser.email" regex-pattern="EMAIL"></f:text-box>
                                    <f:text-box for="currentUser.companyEmail" regex-pattern="EMAIL"></f:text-box>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:text-box for="currentUser.officePhone"></f:text-box>
                                    <f:text-box for="currentUser.officePhoneExt"></f:text-box>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:text-box for="currentUser.homePhone"></f:text-box>
                                    <f:text-box for="currentUser.cellPhone"></f:text-box>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:drop-down-box id="ddbRoles" label="所属角色" auto-show-clear-icon="true" data-control-id="cblRoles"
                                        enable-multi-select="true" multi-select-mode="Tags">
                                        <f:pop-panel>
                                            <f:simple-form body-padding="10px" auto-scroll="true" show-border="true" show-header="false" hidden="true">
                                                <f:items>
                                                    <f:check-box-list id="cblRoles" column-number="3" data-text-field="name"
                                                        data-value-field="id"></f:check-box-list>
                                                </f:items>
                                            </f:simple-form>
                                        </f:pop-panel>
                                    </f:drop-down-box>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:drop-down-box id="ddbTitles" label="拥有职称" auto-show-clear-icon="true" data-control-id="cblTitles"
                                        enable-multi-select="true" multi-select-mode="Tags">
                                        <f:pop-panel>
                                            <f:simple-form id="SimpleForm3" body-padding="10px" auto-scroll="true" show-border="true" show-header="false"
                                                hidden="true">
                                                <f:items>
                                                    <f:check-box-list id="cblTitles" column-number="3" data-text-field="name"
                                                        data-value-field="id"></f:check-box-list>
                                                </f:items>
                                            </f:simple-form>
                                        </f:pop-panel>
                                    </f:drop-down-box>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:drop-down-box id="ddbDept" label="所属部门" auto-show-clear-icon="true">
                                        <f:pop-panel>
                                            <f:grid id="gridDept" show-border="true" show-header="false" hidden="true" width="550" show-grid-header="false"
                                                data-id-field="id" data-text-field="name" enable-tree="true" tree-column="name" data-parent-id-field="parentId"
                                                expand-all-tree-nodes="true" enable-row-lines="false" enable-alternate-row-color="false">
                                                <f:columns>
                                                    <f:render-field column-id="name" data-field="name" header-text="部门名称"
                                                        expand-unused-space="true"></f:render-field>
                                                </f:columns>
                                            </f:grid>
                                        </f:pop-panel>
                                    </f:drop-down-box>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:text-area for="currentUser.remark"></f:text-area>
                                </f:items>
                            </f:form-row>
                        </f:rows>
                    </f:form>
                </f:items>
            </f:panel>
        </th:block>
    </body>

</html>
