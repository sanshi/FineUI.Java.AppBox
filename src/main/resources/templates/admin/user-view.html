<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>查看用户信息</title>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:panel id="Panel1" show-border="false" show-header="false" is-view-port="true" body-padding="10" layout="Fit">
                <f:toolbars>
                    <f:toolbar id="Toolbar1">
                        <f:items>
                            <f:button id="btnClose" icon="SystemClose" text="关闭" click-handler="closeActiveWindow"></f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
                <f:items>
                    <f:form id="SimpleForm1" show-border="true" show-border-shadow="true" show-header="false" body-padding="10" auto-scroll="true">
                        <f:rows>
                            <f:form-row>
                                <f:items>
                                    <f:label for="currentUser.name"></f:label>
                                    <f:label for="currentUser.chineseName"></f:label>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:label for="currentUser.gender"></f:label>
                                    <f:label id="labEnabled" label="启用"></f:label>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:label for="currentUser.email"></f:label>
                                    <f:label for="currentUser.companyEmail"></f:label>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:label for="currentUser.officePhone"></f:label>
                                    <f:label for="currentUser.officePhoneExt"></f:label>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:label for="currentUser.homePhone"></f:label>
                                    <f:label for="currentUser.cellPhone"></f:label>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:label id="labRoles" label="所属角色"></f:label>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:label id="labTitles" label="拥有职称"></f:label>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:label id="labDept" label="所属部门"></f:label>
                                </f:items>
                            </f:form-row>
                            <f:form-row>
                                <f:items>
                                    <f:label for="currentUser.remark"></f:label>
                                </f:items>
                            </f:form-row>
                        </f:rows>
                    </f:form>
                </f:items>
            </f:panel>
        </th:block>
    </body>

</html>
