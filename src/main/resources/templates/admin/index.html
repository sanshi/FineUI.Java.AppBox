<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>首页 - FineUI.Java.AppBox</title>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:panel id="Panel1" layout="HBox" box-config-child-margin="0 10 0 0" show-border="false" show-header="false" is-fluid="true" margin="20">
                <f:items>
                    <f:panel box-flex="1" show-border="false" show-header="false">
                        <f:items>
                            <f:panel id="Panel2" title="系统公告" height="200" margin-bottom="10" body-padding="10" show-border="true" show-border-shadow="true"
                                show-header="true">
                                <f:items>
                                    <f:label id="Label1" text="这是系统公告"></f:label>
                                </f:items>
                            </f:panel>
                            <f:panel id="Panel4" title="系统公告" height="200" margin-bottom="10" body-padding="10" show-border="true" show-border-shadow="true"
                                show-header="true">
                                <f:items>
                                    <f:label id="Label3" text="这是系统公告"></f:label>
                                </f:items>
                            </f:panel>
                        </f:items>
                    </f:panel>
                    <f:panel box-flex="1" margin="0" show-border="false" show-header="false">
                        <f:items>
                            <f:panel id="Panel3" title="代办事宜" height="200" margin-bottom="10" body-padding="10" show-border="true" show-border-shadow="true"
                                show-header="true">
                                <f:items>
                                    <f:label id="Label2" text="这是代办事宜列表"></f:label>
                                </f:items>
                            </f:panel>
                            <f:panel id="Panel6" title="注意事项" height="200" margin-bottom="10" body-padding="10" show-border="true" show-border-shadow="true"
                                show-header="true">
                                <f:items>
                                    <f:label id="Label4" text="这是注意事项列表"></f:label>
                                </f:items>
                            </f:panel>
                        </f:items>
                    </f:panel>
                </f:items>
            </f:panel>
        </th:block>
    </body>

</html>
