<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>菜单管理</title>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:panel id="Panel1" show-border="false" layout="Fit" show-header="false" is-view-port="true" margin="20">
                <f:items>
                    <f:grid id="Grid1" box-flex="1" show-border="true" show-border-shadow="true" show-header="false" enable-check-box-select="false"
                        row-type-from="menus" data-id-field="id" data-text-field="name" data-key-names="id" enable-tree="true" tree-column="name"
                        data-parent-id-field="parentId" expand-all-tree-nodes="true" on-row-command="Grid1_RowCommand">
                        <f:columns>
                            <f:row-number-field enable-tree-number="true"></f:row-number-field>
                            <f:render-field for="name" column-id="name" width="200"></f:render-field>
                            <f:render-field for="navigateUrl" width="200"></f:render-field>
                            <f:render-field for="viewPowerName" width="150"></f:render-field>
                            <f:render-field for="imageUrl" renderer-function="renderImageUrl" width="80"></f:render-field>
                            <f:render-field for="remark" expand-unused-space="true"></f:render-field>
                            <f:render-field for="sortIndex" width="80"></f:render-field>
                            <f:render-field enable-column-hide="false" enable-header-menu="false" width="100">
                                <f:commands>
                                    <f:command command-name="Edit" icon="Pencil" tool-tip="编辑" window-id="Window1" window-title="编辑"
                                        window-iframe-url-format-string="/admin/menu-edit?id={0}" window-iframe-url-fields="id"></f:command>
                                    <f:command command-name="Delete" icon="Delete" tool-tip="删除" css-class="mybtn3" confirm-text="确定删除此记录？"
                                        confirm-target="Top"></f:command>
                                </f:commands>
                            </f:render-field>
                        </f:columns>
                        <f:toolbars>
                            <f:toolbar id="Toolbar1" position="Top">
                                <f:items>
                                    <f:toolbar-fill></f:toolbar-fill>
                                    <f:button id="btnNew" icon="Add" text="新增菜单" click-handler="onNewClick"></f:button>
                                </f:items>
                            </f:toolbar>
                        </f:toolbars>
                    </f:grid>
                </f:items>
            </f:panel>

            <f:window id="Window1" is-modal="true" hidden="true" target="Top" enable-resize="true" enable-maximize="true" enable-iframe="true" width="900"
                height="650" close-action="HidePostBack" on-close="Window1_Close"></f:window>
        </th:block>

        <th:block layout:fragment="script">
            <script>
                function onNewClick(event) {
                    F.ui.Window1.show(F.resolveUrl('/admin/menu-new'), '新增菜单');
                }

                // 图标列：把图标地址渲染成图片（地址是应用根相对路径，子目录部署时补上上下文路径）
                function renderImageUrl(value, params) {
                    if (!value) {
                        return '';
                    }
                    return '<img src="' + F.htmlEncode(F.resolveUrl(value)) + '" />';
                }

            </script>
        </th:block>
    </body>

</html>
