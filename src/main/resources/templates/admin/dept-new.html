<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>新增部门</title>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:panel id="Panel1" show-border="false" show-header="false" is-view-port="true" body-padding="10" layout="Fit">
                <f:toolbars>
                    <f:toolbar id="Toolbar1">
                        <f:items>
                            <f:button id="btnClose" icon="SystemClose" text="关闭" click-handler="onCloseActiveWindowClick"></f:button>
                            <f:toolbar-separator></f:toolbar-separator>
                            <f:button id="btnSaveClose" validate-forms="SimpleForm1" icon="SystemSaveClose" on-click="btnSaveClose_Click" text="保存后关闭">
                            </f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
                <f:items>
                    <f:simple-form id="SimpleForm1" show-border="true" show-border-shadow="true" show-header="false" body-padding="10" auto-scroll="true">
                        <f:items>
                            <f:text-box for="dept.name" required="true" show-red-star="true"></f:text-box>
                            <f:number-box for="dept.sortIndex"></f:number-box>
                            <f:drop-down-box id="ddbParent" label="上级部门" auto-show-clear-icon="true">
                                <f:pop-panel>
                                    <f:grid id="Grid1" show-border="true" show-header="false" hidden="true" width="550" show-grid-header="false"
                                        data-id-field="id" data-text-field="name" enable-tree="true" tree-column="name" data-parent-id-field="parentId"
                                        expand-all-tree-nodes="true" disable-unselectable-rows="true" enable-row-lines="false"
                                        enable-alternate-row-color="false">
                                        <f:columns>
                                            <f:render-field column-id="name" data-field="name" header-text="部门名称" expand-unused-space="true"></f:render-field>
                                        </f:columns>
                                    </f:grid>
                                </f:pop-panel>
                            </f:drop-down-box>
                            <f:text-area for="dept.remark"></f:text-area>
                        </f:items>
                    </f:simple-form>
                </f:items>
            </f:panel>
        </th:block>
    </body>

</html>
