<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java.AppBox - 通用权限管理系统</title>
        <link th:href="@{/res/css/index.css}" rel="stylesheet" />
        <link th:href="@{/res/css/appbox.css}" rel="stylesheet" />
        <link th:href="@{/res/css/mobileview.css}" rel="stylesheet" />
    
    <style type="text/css">
        /* 侧边栏宽度：res/js/index.js 从这两个变量读初始宽度与折叠后的微型宽度，
           必须与侧栏区域上的 Width 属性保持一致（两处都改，否则初始宽度和拖动宽度会打架）。 */
        :root {
            --sidebar-width: 320px;
            --sidebar-minimode-width: 70px;
        }
    </style>
</head>

    <body>
        <th:block layout:fragment="body">

            <f:panel id="mainPanel" layout="Region" css-class="mainpanel" show-border="false" show-header="false" is-view-port="true">
                <f:items>
                    <!--/* 左侧区域：Logo + 菜单树（菜单树由 IndexModel 按当前用户权限从菜单表生成） */-->
                    <f:panel id="sidebarRegion" css-class="sidebarregion" show-border="false" width="320" show-header="false" enable-collapse="false"
                        collapsed="false" layout="VBox" region-position="Left" region-split="true" region-split-icon="false" region-split-width="3"
                        region-split-transparent="true">
                        <f:items>
                            <f:content-panel id="sideheaderTopPanel" css-class="topregion" show-border="false" show-header="false">
                                <div id="sideheader" class="f-widget-header f-mainheader">
                                    <a class="logo-img f-widget-header" href="./">
                                        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
                                            <path fill="currentColor" opacity="0.9" fill-rule="evenodd"
                                                d="M498.526 215.579h-4.58c-22.829-0.196-42.295-14.382-50.262-34.394l-0.13-0.369-1.617-4.042c-2.978-6.535-4.714-14.172-4.714-22.214 0-14.908 5.964-28.424 15.636-38.291l3.225-3.225c2.421-2.436 3.918-5.792 3.918-9.499s-1.497-7.064-3.919-9.5l0 0.001-38.4-38.13c-2.436-2.421-5.792-3.919-9.5-3.919s-7.063 1.497-9.5 3.919l-3.233 3.233c-9.859 9.663-23.373 15.627-38.282 15.627-8.043 0-15.68-1.736-22.558-4.853l0.344 0.14-4.043-1.617c-20.268-8.177-34.341-27.621-34.492-50.373v-4.6c0-7.441-6.032-13.473-13.474-13.473v0h-53.894c-7.441 0-13.474 6.032-13.474 13.473v0 4.58c-0.196 22.828-14.382 42.295-34.394 50.262l-0.369 0.129-4.042 1.617c-6.535 2.978-14.172 4.713-22.214 4.713-14.908 0-28.424-5.964-38.291-15.636l-3.225-3.225c-2.436-2.421-5.792-3.919-9.499-3.919s-7.064 1.497-9.5 3.919l0.001-0.001-38.13 38.4c-2.421 2.436-3.919 5.792-3.919 9.499s1.497 7.064 3.919 9.5l3.233 3.233c9.663 9.859 15.627 23.373 15.627 38.282 0 8.043-1.736 15.68-4.853 22.559l0.14-0.344-1.617 4.042c-8.177 20.268-27.621 34.341-50.373 34.492h-4.6c-7.441 0-13.473 6.032-13.473 13.474v0 53.894c0 7.442 6.032 13.474 13.473 13.474v0h4.58c22.828 0.197 42.295 14.382 50.262 34.394l0.129 0.369 1.617 4.043c2.978 6.534 4.713 14.172 4.713 22.214 0 14.908-5.964 28.425-15.636 38.291l-3.225 3.225c-2.421 2.436-3.919 5.792-3.919 9.5s1.497 7.063 3.919 9.5l-0.001-0 38.4 38.13c2.436 2.421 5.792 3.918 9.499 3.918s7.064-1.497 9.5-3.919l3.233-3.233c9.859-9.663 23.373-15.627 38.282-15.627 8.043 0 15.68 1.736 22.559 4.853l-0.344-0.14 4.042 1.617c20.268 8.177 34.341 27.622 34.492 50.373v4.6c0 7.442 6.032 13.474 13.474 13.474h53.894c7.442 0 13.474-6.032 13.474-13.474v0-4.58c0.197-22.829 14.382-42.295 34.394-50.262l0.369-0.13 4.043-1.617c6.534-2.978 14.172-4.714 22.214-4.714 14.908 0 28.425 5.964 38.291 15.636l3.225 3.225c2.436 2.421 5.792 3.918 9.5 3.918s7.063-1.497 9.5-3.919l-0 0 38.13-38.4c2.421-2.436 3.918-5.792 3.918-9.5s-1.497-7.063-3.919-9.5l-3.233-3.233c-9.663-9.859-15.627-23.373-15.627-38.282 0-8.043 1.736-15.68 4.853-22.558l-0.14 0.344 1.617-4.043c8.177-20.268 27.622-34.341 50.373-34.492h4.6c7.442 0 13.473-6.032 13.473-13.474v0-53.894c0-7.441-6.032-13.474-13.474-13.474v0z M256 107.79c81.854 0 148.21 66.356 148.21 148.21s-66.356 148.21-148.21 148.21S107.79 337.854 107.79 256 174.146 107.79 256 107.79z">
                                            </path>
                                            <path fill="currentColor" opacity="0.6" fill-rule="evenodd"
                                                d="M256.002 107.79c-81.854 0-148.21 66.356-148.21 148.21s66.356 148.21 148.21 148.21c81.854 0 148.21-66.356 148.21-148.21v0c0-81.854-66.356-148.21-148.21-148.21v0z M256.002 323.369c-37.206 0-67.369-30.161-67.369-67.369s30.161-67.369 67.369-67.369c37.206 0 67.369 30.161 67.369 67.369v0c0 37.206-30.161 67.369-67.369 67.369v0z">
                                            </path>
                                        </svg>
                                    </a>
                                    <a class="logo" th:href="@{/}" title="FineUI.Java.AppBox">FineUI.Java</a>
                                    <div class="logo-subtitle">AppBox · Spring Boot</div>
                                </div>
                            </f:content-panel>
                            <f:panel id="leftPanel" css-class="leftregion" box-flex="1" show-border="false" show-header="false" layout="Fit">
                                <f:items>
                                    <f:tree id="treeMenu" show-border="false" show-header="false" enable-single-click-expand="true" hide-h-scrollbar="true"
                                        hide-v-scrollbar="true" expander-to-right="true" header-style="true" all-header-style="true"></f:tree>
                                </f:items>
                            </f:panel>
                        </f:items>
                        <f:listeners>
                            <f:listener event="splitdrag" handler="onSidebarSplitDrag"></f:listener>
                        </f:listeners>
                    </f:panel>

                    <!--/* 右侧区域：顶部页头 + 选项卡工作区 */-->
                    <f:panel id="bodyRegion" css-class="bodyregion" region-position="Center" show-border="false" show-header="false" layout="VBox">
                        <f:items>
                            <f:content-panel id="topPanel" css-class="topregion" show-border="false" show-header="false">
                                <div id="header" class="f-widget-header f-mainheader">
                                    <div class="header-left">
                                        <f:button id="btnCollapseSidebar" css-class="icononlyaction" tool-tip="折叠/展开侧边栏" icon-align="Top" icon-font="_Fold"
                                            enable-default-state="false" tab-index="-1" click-handler="onFoldClick"></f:button>
                                    </div>
                                    <div class="header-right">
                                        <f:button css-class="icontopaction" id="Button1" text="下载源码" icon-align="Top" icon-font="_Download"
                                            enable-default-state="false" enable-default-corner="false" click-handler="onDownloadClick"></f:button>
                                        <!--/* 系统帮助：下拉菜单项由 IndexModel 按全局配置 HelpList 动态生成 */-->
                                        <f:button id="btnSystemHelp" text="系统帮助" css-class="icontopaction" icon-align="Top" icon-font="_Question"
                                            enable-default-state="false" enable-default-corner="false" show-menu-icon="false"></f:button>
                                        <f:button css-class="icontopaction" id="btnThemeSelect" text="主题仓库" icon-align="Top" icon-font="_Skin"
                                            enable-default-state="false" enable-default-corner="false" tab-index="-1" click-handler="onThemeSelectClick">
                                        </f:button>
                                        <f:button id="btnUserName" css-class="userpicaction" icon-url="/res/images/my_face_80.jpg" icon-align="Left"
                                            show-menu-icon="true" enable-default-state="false" enable-default-corner="false">
                                            <f:menu>
                                                <f:menu-button id="btnSignOut" text="安全退出" icon-font="_SignOut" confirm-text="确定退出系统？"
                                                    on-click="btnSignOut_Click"></f:menu-button>
                                            </f:menu>
                                        </f:button>
                                    </div>
                                </div>
                            </f:content-panel>
                            <f:tab-strip id="mainTabStrip" css-class="centerregion" show-ink-bar="true" ink-bar-position="Bottom" box-flex="1"
                                show-border="true" enable-tab-close-menu="true">
                                <f:tabs>
                                    <f:tab id="tabHomepage" title="首页" icon-font="_Home" enable-iframe="true" iframe-url="/admin/index"></f:tab>
                                </f:tabs>
                                <f:tools>
                                    <f:tool icon-font="_Refresh" css-class="tabtool" tool-tip="刷新" id="toolRefresh" click-handler="onToolRefreshClick"></f:tool>
                                    <f:tool icon-font="_Maximize" css-class="tabtool" tool-tip="最大化" id="toolMaximize" click-handler="onToolMaximizeClick">
                                    </f:tool>
                                </f:tools>
                            </f:tab-strip>
                        </f:items>
                    </f:panel>
                </f:items>
            </f:panel>

            <f:window id="windowThemeRoller" title="主题仓库" hidden="true" enable-iframe="true" iframe-url="/themes" clear-iframe-after-close="false"
                is-modal="true" width="850" height="600" enable-close="true" enable-maximize="true" enable-resize="true" window-position="Center"></f:window>
        </th:block>

        <th:block layout:fragment="script">
            <script>
                var PARAMS = {
                    mainPanel: 'mainPanel',
                    mainTabStrip: 'mainTabStrip',
                    treeMenu: 'treeMenu',
                    sidebarRegion: 'sidebarRegion',
                    topPanel: 'topPanel',
                    btnCollapseSidebar: 'btnCollapseSidebar',
                    tabHomepage: 'tabHomepage',
                    windowThemeRoller: 'windowThemeRoller'
                };

            </script>
            <script th:src="@{/res/js/index.js}"></script>
            <script th:src="@{/res/js/mobileview.js}"></script>
        </th:block>
    </body>

</html>
