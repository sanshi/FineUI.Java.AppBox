server.port=8082

# 首页路由：GET / 直接渲染 /index（主框架页；未登录会被安全过滤链重定向到 /login）
fineui.home=index

# ===== 数据库：H2 文件模式（零安装、数据存本地 ./data 文件、重启不丢） =====
# AUTO_SERVER=TRUE：允许 H2 Console 等第二个连接同时连入同一个文件库
spring.datasource.url=jdbc:h2:file:./data/appboxdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Web 控制台：浏览器访问 http://localhost:8082/h2-console 查看/编辑数据
spring.h2.console.enabled=true

# ===== JPA / Hibernate：实体注解即表结构（Code First） =====
# update：库/表不存在则按实体建，已存在只增量改，不删已有数据。种子数据由 AppBoxDataInitializer 在启动时写入（仅首次）
spring.jpa.hibernate.ddl-auto=update
# 开发期打印 SQL，便于观察（生产可关）
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ===== Spring Security CSRF：由 fineui-java 提供令牌仓库与运行时接入，安全过滤链在 SecurityConfig 里自定义 =====
fineui.security-csrf=true
fineui.security-csrf-repository=cookie

# ===== FineUI 全局配置（fineui.* → 全站默认） =====
# 全局主题（切换 themes/{theme}/theme.css）；用户在「主题仓库」选的主题写 Theme cookie 后逐用户覆盖
fineui.theme=pure_black
# 是否启用动画效果（选项卡、窗口等）
fineui.enable-animation=false
# 是否启用移动浏览器自适应
fineui.mobile-adaption=false
# 是否使用自定义美化滚动条
fineui.custom-scrollbar=true
# 必填红星相对标签文本的位置（beforeText / afterText）
fineui.form-red-star-position=beforeText
# 表单字段标签的水平对齐（left / right / top）
fineui.form-label-align=right
# 表格列头筛选图标是否可见
fineui.grid-header-filter-icon-visible=true
# 表格列头排序图标是否可见
fineui.grid-header-sort-icon-visible=true
# 表格分页工具栏是否可见
fineui.grid-paging-toolbar-visible=true
# 表格分页按钮是否右对齐
fineui.grid-pager-align-right=true
# 表格是否显示"已选中 N 行"消息
fineui.grid-show-selection-message=true
# 表格分页工具栏样式（arrowNumberBox / arrow / number）
fineui.grid-paging-type=arrow

# 页面脚本仅允许同源文件与可信模板的逐请求 nonce；不放行内联事件属性或字符串代码执行。
fineui.csp-scripts=true
fineui.csp-allow-self=true
fineui.csp-allow-nonce=true
fineui.csp-allow-unsafe-inline=false
fineui.csp-allow-unsafe-eval=false

# 开发期关闭模板缓存，改模板即时生效
spring.thymeleaf.cache=false

# 日志
logging.level.com.fineui.java=INFO
logging.charset.console=UTF-8

# 应用版本（构建时由 Maven 资源过滤从 pom 填入，登录窗标题显示）
app.version=@project.version@
# 错误页不回显异常文案（避免把实体结构、参数原文泄漏给客户端）
server.error.include-message=never

# 登录由本项目的登录页自行校验，不需要 Spring Security 的内存用户（避免启动时打印随机密码）
# 注意类名随 Boot 4 迁到了 org.springframework.boot.security.autoconfigure 包，写旧的包名排除会静默失效
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration


