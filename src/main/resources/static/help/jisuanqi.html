<!DOCTYPE html>
<html>
<head>
    <title>科学计算器</title>
    <meta charset="UTF-8">
    <!--written by GoldHuman li hai-->
    <!--2000.8-->
    <style>
        body {
            background-color: #fff;
        }

        .buttons table input {
            width: 50px;
        }
    </style>

    <script src="jisuanqi.js"></script>

    <!--written by GoldHuman li hai-->

    <meta name="GENERATOR" content="MSHTML 8.00.6001.18702">
</head>
<body>
    <div align="center">
        <form name="calc">
            <table border="1" width="500" height="250">
                <tbody>
                    <tr>
                        <td height="50">
                            <table width="500">
                                <tbody>
                                    <tr>
                                        <td></td>
                                        <td>
                                            <div align="center">
                                                <input value="0" readonly size="40" name="display">
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <table width="500">
                                <tbody>
                                    <tr>
                                        <td width="290">
                                            <input data-calc-action="inputChangCarry" data-calc-args="[16]" type="radio" name="carry">
                                            十六进制
                                            <input data-calc-action="inputChangCarry" data-calc-args="[10]" checked type="radio" name="carry">
                                            十进制
                                            <input data-calc-action="inputChangCarry" data-calc-args="[8]" type="radio" name="carry">
                                            八进制
                                            <input data-calc-action="inputChangCarry" data-calc-args="[2]" type="radio" name="carry">
                                            二进制
                                        </td>
                                        <td></td>
                                        <td width="135">
                                            <input data-calc-action="inputChangAngle" data-calc-args="[&quot;d&quot;]" value="d" checked type="radio" name="angle">
                                            角度制
                                            <input data-calc-action="inputChangAngle" data-calc-args="[&quot;r&quot;]" value="r" type="radio" name="angle">
                                            弧度制
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <table width="500">
                                <tbody>
                                    <tr>
                                        <td width="170">
                                            <input data-calc-action="inputshift" type="checkbox" name="shiftf">上档功能
                                            <input data-calc-action="inputshift" type="checkbox" name="hypf">双曲函数
                                        </td>
                                        <td>
                                            <input style="background-color: lightgrey" readonly size="3" name="bracket">
                                            <input style="background-color: lightgrey" readonly size="3" name="memory">
                                            <input style="background-color: lightgrey" readonly size="3" name="operator">
                                        </td>
                                        <td width="183">
                                            <input style="color: red" data-calc-action="backspace" value=" 退格 " type="button">
                                            <input style="color: red" data-calc-action="clearDisplay" value=" 清屏 "
                                                   type="button">
                                            <input style="color: red" data-calc-action="clearall" value=" 全清" type="button">
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <table class="buttons" width="500">
                                <tbody>
                                    <tr>
                                        <td>
                                            <table>
                                                <tbody>
                                                    <tr align="middle">
                                                        <td>
                                                            <input style="color: blue" data-calc-action="inputfunction" data-calc-args="[&quot;pi&quot;,&quot;pi&quot;]" value=" PI " type="button"
                                                                   name="pi">
                                                        </td>
                                                        <td>
                                                            <input style="color: blue" data-calc-action="inputfunction" data-calc-args="[&quot;e&quot;,&quot;e&quot;]" value=" E  " type="button"
                                                                   name="e">
                                                        </td>
                                                        <td>
                                                            <input style="color: #ff00ff" data-calc-action="inputfunction" data-calc-args="[&quot;dms&quot;,&quot;deg&quot;]" value="d.ms" type="button"
                                                                   name="bt">
                                                        </td>
                                                    </tr>
                                                    <tr align="middle">
                                                        <td>
                                                            <input style="color: #ff00ff" data-calc-action="addbracket" value=" (  " type="button">
                                                        </td>
                                                        <td>
                                                            <input style="color: #ff00ff" data-calc-action="disbracket" value=" )  " type="button">
                                                        </td>
                                                        <td>
                                                            <input style="color: #ff00ff" data-calc-action="inputfunction" data-calc-args="[&quot;ln&quot;,&quot;exp&quot;]" value=" ln " type="button"
                                                                   name="ln">
                                                        </td>
                                                    </tr>
                                                    <tr align="middle">
                                                        <td>
                                                            <input style="color: #ff00ff" data-calc-action="inputtrig" data-calc-args="[&quot;sin&quot;,&quot;arcsin&quot;,&quot;hypsin&quot;,&quot;ahypsin&quot;]"
                                                                   value="sin " type="button" name="sin">
                                                        </td>
                                                        <td>
                                                            <input style="color: #ff00ff" data-calc-action="operation" data-calc-args="[&quot;^&quot;,7]" value="x^y " type="button">
                                                        </td>
                                                        <td>
                                                            <input style="color: #ff00ff" data-calc-action="inputfunction" data-calc-args="[&quot;log&quot;,&quot;expdec&quot;]" value="log "
                                                                   type="button" name="log">
                                                        </td>
                                                    </tr>
                                                    <tr align="middle">
                                                        <td>
                                                            <input style="color: #ff00ff" data-calc-action="inputtrig" data-calc-args="[&quot;cos&quot;,&quot;arccos&quot;,&quot;hypcos&quot;,&quot;ahypcos&quot;]"
                                                                   value="cos " type="button" name="cos">
                                                        </td>
                                                        <td>
                                                            <input style="color: #ff00ff" data-calc-action="inputfunction" data-calc-args="[&quot;cube&quot;,&quot;cubt&quot;]" value="x^3 "
                                                                   type="button" name="cube">
                                                        </td>
                                                        <td>
                                                            <input style="color: #ff00ff" data-calc-action="inputfunction" data-calc-args="[&quot;!&quot;,&quot;!&quot;]" value=" n! " type="button">
                                                        </td>
                                                    </tr>
                                                    <tr align="middle">
                                                        <td>
                                                            <input style="color: #ff00ff" data-calc-action="inputtrig" data-calc-args="[&quot;tan&quot;,&quot;arctan&quot;,&quot;hyptan&quot;,&quot;ahyptan&quot;]"
                                                                   value="tan " type="button" name="tan">
                                                        </td>
                                                        <td>
                                                            <input style="color: #ff00ff" data-calc-action="inputfunction" data-calc-args="[&quot;sqr&quot;,&quot;sqrt&quot;]" value="x^2 "
                                                                   type="button" name="sqr">
                                                        </td>
                                                        <td>
                                                            <input style="color: #ff00ff" data-calc-action="inputfunction" data-calc-args="[&quot;recip&quot;,&quot;recip&quot;]" value="1/x "
                                                                   type="button">
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </td>
                                        <td width="30"></td>
                                        <td>
                                            <table>
                                                <tbody>
                                                    <tr>
                                                        <td>
                                                            <input style="color: red" data-calc-action="putmemory" value=" 储存 " type="button">
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <input style="color: red" data-calc-action="getmemory" value=" 取存 " type="button">
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <input style="color: red" data-calc-action="addmemory" value=" 累存 " type="button">
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <input style="color: red" data-calc-action="multimemory" value=" 积存 " type="button">
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td height="33">
                                                            <input style="color: red" data-calc-action="clearmemory" value=" 清存 " type="button">
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </td>
                                        <td width="30"></td>
                                        <td>
                                            <table>
                                                <tbody>
                                                    <tr align="middle">
                                                        <td>
                                                            <input style="color: blue" data-calc-action="inputkey" data-calc-args="[&quot;7&quot;]" value=" 7 " type="button" name="k7">
                                                        </td>
                                                        <td>
                                                            <input style="color: blue" data-calc-action="inputkey" data-calc-args="[&quot;8&quot;]" value=" 8 " type="button" name="k8">
                                                        </td>
                                                        <td>
                                                            <input style="color: blue" data-calc-action="inputkey" data-calc-args="[&quot;9&quot;]" value=" 9 " type="button" name="k9">
                                                        </td>
                                                        <td>
                                                            <input style="color: red" data-calc-action="operation" data-calc-args="[&quot;/&quot;,6]" value=" / " type="button">
                                                        </td>
                                                        <td>
                                                            <input style="color: red" data-calc-action="operation" data-calc-args="[&quot;%&quot;,6]" value="取余" type="button">
                                                        </td>
                                                        <td>
                                                            <input style="color: red" data-calc-action="operation" data-calc-args="[&quot;&amp;&quot;,3]" value=" 与 " type="button">
                                                        </td>
                                                    </tr>
                                                    <tr align="middle">
                                                        <td>
                                                            <input style="color: blue" data-calc-action="inputkey" data-calc-args="[&quot;4&quot;]" value=" 4 " type="button" name="k4">
                                                        </td>
                                                        <td>
                                                            <input style="color: blue" data-calc-action="inputkey" data-calc-args="[&quot;5&quot;]" value=" 5 " type="button" name="k5">
                                                        </td>
                                                        <td>
                                                            <input style="color: blue" data-calc-action="inputkey" data-calc-args="[&quot;6&quot;]" value=" 6 " type="button" name="k6">
                                                        </td>
                                                        <td>
                                                            <input style="color: red" data-calc-action="operation" data-calc-args="[&quot;*&quot;,6]" value=" * " type="button">
                                                        </td>
                                                        <td>
                                                            <input style="color: red" data-calc-action="inputfunction" data-calc-args="[&quot;floor&quot;,&quot;deci&quot;]" value="取整" type="button"
                                                                   name="floor">
                                                        </td>
                                                        <td>
                                                            <input style="color: red" data-calc-action="operation" data-calc-args="[&quot;|&quot;,1]" value=" 或 " type="button">
                                                        </td>
                                                    </tr>
                                                    <tr align="middle">
                                                        <td>
                                                            <input style="color: blue" data-calc-action="inputkey" data-calc-args="[&quot;1&quot;]" value=" 1 " type="button">
                                                        </td>
                                                        <td>
                                                            <input style="color: blue" data-calc-action="inputkey" data-calc-args="[&quot;2&quot;]" value=" 2 " type="button" name="k2">
                                                        </td>
                                                        <td>
                                                            <input style="color: blue" data-calc-action="inputkey" data-calc-args="[&quot;3&quot;]" value=" 3 " type="button" name="k3">
                                                        </td>
                                                        <td>
                                                            <input style="color: red" data-calc-action="operation" data-calc-args="[&quot;-&quot;,5]" value=" - " type="button">
                                                        </td>
                                                        <td>
                                                            <input style="color: red" data-calc-action="operation" data-calc-args="[&quot;&lt;&quot;,4]" value="左移" type="button">
                                                        </td>
                                                        <td>
                                                            <input style="color: red" data-calc-action="inputfunction" data-calc-args="[&quot;~&quot;,&quot;~&quot;]" value=" 非 " type="button">
                                                        </td>
                                                    </tr>
                                                    <tr align="middle">
                                                        <td>
                                                            <input style="color: blue" data-calc-action="inputkey" data-calc-args="[&quot;0&quot;]" value=" 0 " type="button">
                                                        </td>
                                                        <td>
                                                            <input style="color: blue" data-calc-action="changeSign" value="+/-" type="button">
                                                        </td>
                                                        <td>
                                                            <input style="color: blue" data-calc-action="inputkey" data-calc-args="[&quot;.&quot;]" value=" . " type="button" name="kp">
                                                        </td>
                                                        <td>
                                                            <input style="color: red" data-calc-action="operation" data-calc-args="[&quot;+&quot;,5]" value=" + " type="button">
                                                        </td>
                                                        <td>
                                                            <input style="color: red" data-calc-action="result" value=" ＝ " type="button">
                                                        </td>
                                                        <td>
                                                            <input style="color: red" data-calc-action="operation" data-calc-args="[&quot;x&quot;,2]" value="异或" type="button">
                                                        </td>
                                                    </tr>
                                                    <tr align="middle">
                                                        <td>
                                                            <input style="color: blue" disabled data-calc-action="inputkey" data-calc-args="[&quot;a&quot;]" value=" A " type="button"
                                                                   name="ka">
                                                        </td>
                                                        <td>
                                                            <input style="color: blue" disabled data-calc-action="inputkey" data-calc-args="[&quot;b&quot;]" value=" B " type="button"
                                                                   name="kb">
                                                        </td>
                                                        <td>
                                                            <input style="color: blue" disabled data-calc-action="inputkey" data-calc-args="[&quot;c&quot;]" value=" C " type="button"
                                                                   name="kc">
                                                        </td>
                                                        <td>
                                                            <input style="color: blue" disabled data-calc-action="inputkey" data-calc-args="[&quot;d&quot;]" value=" D " type="button"
                                                                   name="kd">
                                                        </td>
                                                        <td>
                                                            <input style="color: blue" disabled data-calc-action="inputkey" data-calc-args="[&quot;e&quot;]" value=" E　" type="button"
                                                                   name="ke">
                                                        </td>
                                                        <td>
                                                            <input style="color: blue" disabled data-calc-action="inputkey" data-calc-args="[&quot;f&quot;]" value=" F　" type="button"
                                                                   name="kf">
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                </tbody>
            </table>
        </form>
    </div>
</body>
</html>
